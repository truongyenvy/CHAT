<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat Mã Hóa 3 Lớp (RSA + AES + SHA256)</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: radial-gradient(circle at center, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container kính mờ (Glassmorphism) */
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 520px;
            padding: 32px;
        }

        .header { text-align: center; margin-bottom: 24px; }
        .logo-icon { font-size: 42px; margin-bottom: 8px; display: inline-block; }
        .title { font-size: 22px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #94a3b8; }

        .input-group { margin-bottom: 16px; position: relative; }
        .input-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; text-align: left; }
        
        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        input:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover { opacity: 0.95; transform: translateY(-1px); }

        /* Khung Chat */
        #chat-box {
            height: 280px;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 12px;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .me { background: #0284c7; align-self: flex-end; border-bottom-right-radius: 2px; }
        .them { background: #334155; align-self: flex-start; border-bottom-left-radius: 2px; }

        .encrypted-preview {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 6px;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 6px;
            word-break: break-all;
        }

        /* Badge Bảo mật */
        .security-badge {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="logo-icon">🔒</div>
        <div class="title">Secure Web Chat</div>
        <div class="subtitle">Bảo mật mã hóa End-to-End (RSA + AES + SHA)</div>
    </div>

    <!-- 1. Màn hình đăng nhập -->
    <div id="login-section">
        <div class="input-group">
            <label>Tên tài khoản</label>
            <input type="text" id="username" placeholder="Nhập biệt danh của bạn...">
        </div>
        <button onclick="login()">Vào Phòng Chat</button>
    </div>

    <!-- 2. Màn hình chat -->
    <div id="chat-section" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span style="font-size: 13px; color: #94a3b8;">Xin chào: <b id="user-display" style="color:#38bdf8"></b></span>
        </div>

        <div class="input-group">
            <label>Gửi đến:</label>
            <select id="receiver-select" onchange="switchChatUser()"></select>
        </div>

        <div id="chat-box"></div>

        <div class="input-group">
            <input type="text" id="message-input" placeholder="Nhập tin nhắn bảo mật..." onkeypress="if(event.key==='Enter') sendEncryptedMessage()">
        </div>
        <button onclick="sendEncryptedMessage()">Mã Hóa & Gửi Tin Nhắn</button>
    </div>

    <div class="security-badge">
        🛡️ RSA-2048 | AES-256-GCM | SHA-256 | Digital Signature Active
    </div>
</div>

<script>
const socket = io();
let myUsername = "";
let rsaKeyPair = null;  // Khóa Mã hóa/Giải mã RSA
let signKeyPair = null; // 8. Khóa Chữ ký số (Digital Signature)

// 2. Bộ lưu trữ lịch sử chat riêng biệt cho từng người dùng
const chatHistory = {};

// 6. CSDL Database ngầm (IndexedDB) lưu Ciphertext
let db;
const request = indexedDB.open("SecureChatDB", 1);
request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("messages")) {
        db.createObjectStore("messages", { keyPath: "id", autoIncrement: true });
    }
};
request.onsuccess = (e) => { db = e.target.result; };

function saveToDatabase(packet) {
    if (!db) return;
    const tx = db.transaction("messages", "readwrite");
    tx.objectStore("messages").add(packet);
}

function bufferToBase64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function base64ToBuffer(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer; }

// Khởi tạo cặp khóa Mã hóa & Khóa Chữ ký số
async function generateKeys() {
    rsaKeyPair = await window.crypto.subtle.generateKey(
        { name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
        true, ["encrypt", "decrypt"]
    );
    // 8. Tạo cặp khóa Chữ ký số RSA-PSS
    signKeyPair = await window.crypto.subtle.generateKey(
        { name: "RSA-PSS", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
        true, ["sign", "verify"]
    );
}

async function exportPubKey(key) {
    const exported = await window.crypto.subtle.exportKey("spki", key);
    return bufferToBase64(exported);
}

async function importPubKey(b64, type) {
    const algo = type === 'encrypt' 
        ? { name: "RSA-OAEP", hash: "SHA-256" }
        : { name: "RSA-PSS", hash: "SHA-256" };
    const usage = type === 'encrypt' ? ["encrypt"] : ["verify"];
    return await window.crypto.subtle.importKey("spki", base64ToBuffer(b64), algo, true, usage);
}

// 5. SHA-256 băm dữ liệu
async function computeSHA256(text) {
    const encoder = new TextEncoder();
    const hashBuffer = await window.crypto.subtle.digest('SHA-256', encoder.encode(text));
    return bufferToBase64(hashBuffer);
}

// 1. Đăng ký / Đăng nhập
async function login() {
    myUsername = document.getElementById('username').value.trim();
    if (!myUsername) return alert("Vui lòng nhập tên!");

    await generateKeys();
    const encPubKeyB64 = await exportPubKey(rsaKeyPair.publicKey);
    const signPubKeyB64 = await exportPubKey(signKeyPair.publicKey);

    socket.emit('register_user', { 
        username: myUsername, 
        publicKey: encPubKeyB64,
        signPublicKey: signPubKeyB64
    });

    document.getElementById('login-section').style.display = 'none';
    document.getElementById('chat-section').style.display = 'block';
    document.getElementById('user-display').innerText = myUsername;
}

socket.on('update_user_list', (userList) => {
    const select = document.getElementById('receiver-select');
    const currentSelected = select.value;
    select.innerHTML = '';

    userList.forEach(u => {
        if (u !== myUsername) {
            const opt = document.createElement('option');
            opt.value = u;
            opt.innerText = u;
            if (u === currentSelected) opt.selected = true;
            select.appendChild(opt);

            if (!chatHistory[u]) chatHistory[u] = [];
        }
    });
    switchChatUser();
});

// 2. Chuyển đổi tin nhắn riêng biệt cho từng người
function switchChatUser() {
    const activeUser = document.getElementById('receiver-select').value;
    const box = document.getElementById('chat-box');
    box.innerHTML = '';

    if (activeUser && chatHistory[activeUser]) {
        chatHistory[activeUser].forEach(msg => {
            renderMessageToUI(msg.sender, msg.text, msg.isMe, msg.cipherPreview);
        });
    }
}

// 3, 4, 5, 8. Luồng mã hóa tin nhắn + Chữ ký số
async function sendEncryptedMessage() {
    const text = document.getElementById('message-input').value.trim();
    const receiver = document.getElementById('receiver-select').value;
    if (!text || !receiver) return;

    socket.emit('get_public_key', receiver, async (res) => {
        if (!res.success) return alert(res.message);

        // 5. Tạo mã băm SHA-256
        const hashHex = await computeSHA256(text);
        const payload = JSON.stringify({ msg: text, hash: hashHex });

        // 8. Ký Chữ ký số RSA-PSS lên gói tin
        const encoder = new TextEncoder();
        const signatureBuf = await window.crypto.subtle.sign(
            { name: "RSA-PSS", saltLength: 32 },
            signKeyPair.privateKey,
            encoder.encode(payload)
        );
        const signatureB64 = bufferToBase64(signatureBuf);

        // 3. Mã hóa AES-256-GCM
        const aesKey = await window.crypto.subtle.generateKey(
            { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
        );
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        
        const encryptedContent = await window.crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv }, aesKey, encoder.encode(payload)
        );

        // 4. Mã hóa RSA-2048 cho khóa AES
        const exportedAesKey = await window.crypto.subtle.exportKey("raw", aesKey);
        const receiverPubKey = await importPubKey(res.publicKey, 'encrypt');
        
        const encryptedAesKey = await window.crypto.subtle.encrypt(
            { name: "RSA-OAEP" }, receiverPubKey, exportedAesKey
        );

        const cipherTextB64 = bufferToBase64(encryptedContent);
        const senderSignPubKeyB64 = await exportPubKey(signKeyPair.publicKey);

        const packet = {
            senderUsername: myUsername,
            receiverUsername: receiver,
            encryptedContent: cipherTextB64,
            encryptedAesKey: bufferToBase64(encryptedAesKey),
            iv: bufferToBase64(iv),
            signature: signatureB64,            // Chữ ký số
            senderSignPubKey: senderSignPubKeyB64 // Khóa công khai xác thực chữ ký
        };

        socket.emit('send_secure_message', packet);

        // 6. Lưu Ciphertext vào Database
        saveToDatabase(packet);

        if (!chatHistory[receiver]) chatHistory[receiver] = [];
        chatHistory[receiver].push({ sender: myUsername, text: text, isMe: true, cipherPreview: cipherTextB64 });

        const activeUser = document.getElementById('receiver-select').value;
        if (activeUser === receiver) {
            renderMessageToUI(myUsername, text, true, cipherTextB64);
        }

        document.getElementById('message-input').value = '';
    });
}

// 解密 & 7. Kiểm tra tính toàn vẹn + Chữ ký số
socket.on('receive_secure_message', async (data) => {
    try {
        // 6. Lưu Ciphertext vào Database
        saveToDatabase(data);

        // 4. Giải mã khóa AES bằng Private Key RSA
        const rawAesKey = await window.crypto.subtle.decrypt(
            { name: "RSA-OAEP" }, rsaKeyPair.privateKey, base64ToBuffer(data.encryptedAesKey)
        );

        const aesKey = await window.crypto.subtle.importKey(
            "raw", rawAesKey, { name: "AES-GCM" }, false, ["decrypt"]
        );

        // 3. Giải mã tin nhắn AES-256-GCM
        const decryptedBuffer = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: new Uint8Array(base64ToBuffer(data.iv)) },
            aesKey, base64ToBuffer(data.encryptedContent)
        );

        const decodedText = new TextDecoder().decode(decryptedBuffer);
        const payload = JSON.parse(decodedText);

        // 8. Kiểm tra Chữ ký số
        let isSignatureValid = false;
        if (data.signature && data.senderSignPubKey) {
            const senderSignKey = await importPubKey(data.senderSignPubKey, 'verify');
            const encoder = new TextEncoder();
            isSignatureValid = await window.crypto.subtle.verify(
                { name: "RSA-PSS", saltLength: 32 },
                senderSignKey,
                base64ToBuffer(data.signature),
                encoder.encode(decodedText)
            );
        }

        // 5 & 7. Kiểm tra tính toàn vẹn SHA-256
        const recomputedHash = await computeSHA256(payload.msg);
        let displayText = payload.msg;

        if (recomputedHash !== payload.hash || !isSignatureValid) {
            displayText = "[CẢNH BÁO: Tin nhắn bị can thiệp hoặc chữ ký không hợp lệ!]";
        }

        const sender = data.senderUsername;
        if (!chatHistory[sender]) chatHistory[sender] = [];
        chatHistory[sender].push({ sender: sender, text: displayText, isMe: false, cipherPreview: data.encryptedContent });

        const activeUser = document.getElementById('receiver-select').value;
        if (activeUser === sender) {
            renderMessageToUI(sender, displayText, false, data.encryptedContent);
        }

    } catch (err) {
        console.error("Lỗi giải mã:", err);
    }
});

function renderMessageToUI(sender, text, isMe, cipherPreview = "") {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${isMe ? 'me' : 'them'}`;
    
    let html = `<small style="opacity:0.75; font-size:11px;">${sender}</small><br><b>${text}</b>`;
    if (cipherPreview) {
        html += `<div class="encrypted-preview">🔒 Payload: ${cipherPreview.substring(0, 30)}...</div>`;
    }
    
    div.innerHTML = html;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
