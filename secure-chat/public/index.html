<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Web Chat</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #111827
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {

            width: 95%;
            max-width: 1100px;

            min-height: 650px;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.4);
        }

        h1 {

            text-align: center;

            margin-top: 0;
            margin-bottom: 8px;

            font-size: 32px;
        }

        .subtitle {

            text-align: center;

            color: #cbd5e1;

            margin-bottom: 30px;
        }

        /* ==========================
           AUTH
        ========================== */

        #authScreen {

            max-width: 450px;

            margin: auto;
        }

        .input-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #cbd5e1;
        }

        input,
        select {

            width: 100%;

            padding: 13px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,0.2);

            background:
                rgba(0,0,0,0.25);

            color: white;

            outline: none;

            font-size: 15px;
        }

        select option {

            background: #1e293b;

            color: white;
        }

        input:focus,
        select:focus {

            border-color: #60a5fa;
        }

        button {

            border: none;

            border-radius: 10px;

            padding: 13px 18px;

            background: #2563eb;

            color: white;

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s;
        }

        button:hover {

            background: #1d4ed8;

            transform: translateY(-1px);
        }

        button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }

        .auth-button {

            width: 100%;

            margin-top: 5px;
        }

        .switch-auth {

            text-align: center;

            margin-top: 20px;

            color: #cbd5e1;
        }

        .switch-auth span {

            color: #60a5fa;

            cursor: pointer;

            font-weight: bold;
        }

        .status {

            margin-top: 15px;

            text-align: center;

            min-height: 20px;

            color: #93c5fd;
        }

        /* ==========================
           CHAT
        ========================== */

        #chatScreen {

            display: none;
        }

        .chat-layout {

            display: grid;

            grid-template-columns:
                230px 1fr;

            gap: 20px;

            min-height: 500px;
        }

        .sidebar {

            background:
                rgba(0,0,0,0.2);

            border-radius: 15px;

            padding: 18px;
        }

        .sidebar h3 {

            margin-top: 0;
        }

        .user-status {

            color: #86efac;

            font-size: 13px;

            margin-bottom: 15px;
        }

        .logout-button {

            width: 100%;

            background: #dc2626;

            margin-top: 20px;
        }

        .logout-button:hover {

            background: #b91c1c;
        }

        .chat-area {

            display: flex;

            flex-direction: column;

            background:
                rgba(0,0,0,0.15);

            border-radius: 15px;

            padding: 18px;
        }

        .receiver-box {

            margin-bottom: 15px;
        }

        .chat-box {

            flex: 1;

            min-height: 350px;

            max-height: 400px;

            overflow-y: auto;

            padding: 15px;

            background:
                rgba(0,0,0,0.2);

            border-radius: 12px;

            margin-bottom: 15px;
        }

        .message {

            margin-bottom: 12px;

            display: flex;
        }

        .message.mine {

            justify-content: flex-end;
        }

        .message-content {

            max-width: 70%;

            padding: 10px 14px;

            border-radius: 12px;

            background: #334155;

            word-wrap: break-word;
        }

        .message.mine .message-content {

            background: #2563eb;
        }

        .message-info {

            font-size: 11px;

            opacity: 0.7;

            margin-bottom: 4px;
        }

        .message-text {

            white-space: pre-wrap;

            word-break: break-word;
        }

        .message-input-area {

            display: flex;

            gap: 10px;
        }

        .message-input-area input {

            flex: 1;
        }

        .security-badge {

            text-align: center;

            margin-top: 15px;

            padding: 10px;

            border-radius: 10px;

            background:
                rgba(34,197,94,0.12);

            border:
                1px solid
                rgba(34,197,94,0.25);

            color: #86efac;

            font-size: 12px;
        }

        .empty-message {

            text-align: center;

            color: #94a3b8;

            margin-top: 100px;
        }

        @media (max-width: 700px) {

            .card {

                width: 100%;

                min-height: 100vh;

                border-radius: 0;

                padding: 20px;
            }

            .chat-layout {

                grid-template-columns: 1fr;
            }

            .sidebar {

                min-height: auto;
            }

            .chat-box {

                min-height: 350px;
            }

            .message-content {

                max-width: 85%;
            }
        }

    </style>

</head>

<body>

<div class="card">

    <h1>Secure Web Chat</h1>

    <div class="subtitle">
        Bảo mật mã hóa End-to-End (RSA + AES + SHA)
    </div>


    <!-- ==========================================
         AUTH SCREEN
    =========================================== -->

    <div id="authScreen">

        <div class="input-group">

            <label>Tên tài khoản</label>

            <input
                type="text"
                id="username"
                placeholder="Nhập tên tài khoản"
                autocomplete="username"
            >

        </div>


        <div class="input-group">

            <label>Mật khẩu</label>

            <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
            >

        </div>


        <button
            class="auth-button"
            id="authButton"
            onclick="handleAuth()"
        >
            Đăng nhập
        </button>


        <div class="switch-auth">

            <span id="switchText">
                Chưa có tài khoản? Đăng ký
            </span>

        </div>


        <div
            class="status"
            id="authStatus"
        ></div>

    </div>


    <!-- ==========================================
         CHAT SCREEN
    =========================================== -->

    <div id="chatScreen">

        <div class="chat-layout">


            <!-- SIDEBAR -->

            <div class="sidebar">

                <h3>Tài khoản</h3>

                <div
                    id="currentUser"
                    style="margin-bottom: 10px;"
                >
                    -
                </div>

                <div class="user-status">
                    ● Đang trực tuyến
                </div>


                <label>
                    Người nhận
                </label>

                <select id="receiverSelect">

                    <option value="">
                        -- Chọn người nhận --
                    </option>

                </select>


                <button
                    class="logout-button"
                    onclick="logout()"
                >
                    Đăng xuất
                </button>

            </div>


            <!-- CHAT -->

            <div class="chat-area">


                <div class="receiver-box">

                    <strong>
                        Tin nhắn bảo mật
                    </strong>

                </div>


                <div
                    class="chat-box"
                    id="chatBox"
                >

                    <div class="empty-message">
                        Chưa có tin nhắn.
                    </div>

                </div>


                <div class="message-input-area">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Nhập tin nhắn..."
                        onkeydown="handleEnter(event)"
                    >

                    <button
                        id="sendButton"
                        onclick="sendMessage()"
                    >
                        Mã Hóa & Gửi Tin Nhắn
                    </button>

                </div>


                <div class="security-badge">

                    RSA-2048 |
                    AES-256-GCM |
                    SHA-256 |
                    RSA-PSS Digital Signature

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    // =====================================================
    // SOCKET.IO
    // =====================================================

    const socket = io();


    // =====================================================
    // GLOBAL VARIABLES
    // =====================================================

    let currentUsername = null;

    let isRegisterMode = false;

    let rsaKeyPair = null;

    let signKeyPair = null;

    let db = null;

    let dbReady = false;


    // =====================================================
    // INDEXEDDB
    // =====================================================

    /*
        Version 2 rất quan trọng.

        Bản cũ dùng version 1 chỉ có messages.

        Khi thêm store "keys", phải tăng version
        để onupgradeneeded chạy lại.
    */

    const dbRequest =
        indexedDB.open("SecureChatDB", 2);


    dbRequest.onupgradeneeded = function(event) {

        const database = event.target.result;


        // ================================
        // MESSAGE STORE
        // ================================

        if (
            !database.objectStoreNames.contains(
                "messages"
            )
        ) {

            const messageStore =
                database.createObjectStore(
                    "messages",
                    {
                        keyPath: "id",
                        autoIncrement: true
                    }
                );

            messageStore.createIndex(
                "chatKey",
                "chatKey",
                {
                    unique: false
                }
            );
        }


        // ================================
        // KEY STORE
        // ================================

        if (
            !database.objectStoreNames.contains(
                "keys"
            )
        ) {

            database.createObjectStore(
                "keys",
                {
                    keyPath: "id"
                }
            );
        }

    };


    dbRequest.onsuccess = function(event) {

        db = event.target.result;

        dbReady = true;

        console.log(
            "IndexedDB connected successfully."
        );
    };


    dbRequest.onerror = function(event) {

        console.error(
            "IndexedDB error:",
            event.target.error
        );

        alert(
            "Không thể khởi tạo bộ nhớ bảo mật!"
        );
    };


    // =====================================================
    // CHỜ INDEXEDDB
    // =====================================================

    function waitForDatabase() {

        return new Promise(
            (resolve, reject) => {

                if (dbReady) {

                    resolve();

                    return;
                }


                const timer =
                    setInterval(() => {

                        if (dbReady) {

                            clearInterval(timer);

                            resolve();
                        }

                    }, 100);

            }
        );
    }


    // =====================================================
    // SHA-256
    // =====================================================

    async function sha256(text) {

        const encoder =
            new TextEncoder();

        const data =
            encoder.encode(text);

        const hashBuffer =
            await crypto.subtle.digest(
                "SHA-256",
                data
            );

        const hashArray =
            Array.from(
                new Uint8Array(hashBuffer)
            );

        return hashArray
            .map(
                b => b
                    .toString(16)
                    .padStart(2, "0")
            )
            .join("");
    }


    // =====================================================
    // ARRAY BUFFER -> BASE64
    // =====================================================

    function arrayBufferToBase64(buffer) {

        const bytes =
            new Uint8Array(buffer);

        let binary = "";

        const chunkSize = 0x8000;

        for (
            let i = 0;
            i < bytes.length;
            i += chunkSize
        ) {

            const chunk =
                bytes.subarray(
                    i,
                    Math.min(
                        i + chunkSize,
                        bytes.length
                    )
                );

            binary += String.fromCharCode(
                ...chunk
            );
        }

        return btoa(binary);
    }


    // =====================================================
    // BASE64 -> ARRAY BUFFER
    // =====================================================

    function base64ToArrayBuffer(base64) {

        const binary =
            atob(base64);

        const bytes =
            new Uint8Array(
                binary.length
            );

        for (
            let i = 0;
            i < binary.length;
            i++
        ) {

            bytes[i] =
                binary.charCodeAt(i);
        }

        return bytes.buffer;
    }


    // =====================================================
    // GENERATE RSA KEYS
    // =====================================================

    async function generateKeys() {

        // RSA-OAEP
        rsaKeyPair =
            await crypto.subtle.generateKey(
                {
                    name: "RSA-OAEP",

                    modulusLength: 2048,

                    publicExponent:
                        new Uint8Array([
                            1,
                            0,
                            1
                        ]),

                    hash: "SHA-256"
                },

                true,

                [
                    "encrypt",
                    "decrypt"
                ]
            );


        // RSA-PSS
        signKeyPair =
            await crypto.subtle.generateKey(
                {
                    name: "RSA-PSS",

                    modulusLength: 2048,

                    publicExponent:
                        new Uint8Array([
                            1,
                            0,
                            1
                        ]),

                    hash: "SHA-256"
                },

                true,

                [
                    "sign",
                    "verify"
                ]
            );

    }


    // =====================================================
    // EXPORT PUBLIC KEY
    // =====================================================

    async function exportPublicKey(publicKey) {

        const spki =
            await crypto.subtle.exportKey(
                "spki",
                publicKey
            );

        return arrayBufferToBase64(spki);
    }


    // =====================================================
    // SAVE KEYS TO INDEXEDDB
    // =====================================================

    async function saveKeys() {

        await waitForDatabase();


        return new Promise(
            (resolve, reject) => {

                const transaction =
                    db.transaction(
                        ["keys"],
                        "readwrite"
                    );

                const store =
                    transaction.objectStore(
                        "keys"
                    );


                store.put({

                    id: "myKeys",

                    rsaPublicKey:
                        rsaKeyPair.publicKey,

                    rsaPrivateKey:
                        rsaKeyPair.privateKey,

                    signPublicKey:
                        signKeyPair.publicKey,

                    signPrivateKey:
                        signKeyPair.privateKey

                });


                transaction.oncomplete =
                    () => resolve();


                transaction.onerror =
                    () => reject(
                        transaction.error
                    );

            }
        );
    }


    // =====================================================
    // LOAD KEYS FROM INDEXEDDB
    // =====================================================

    async function loadKeys() {

        await waitForDatabase();


        return new Promise(
            (resolve, reject) => {

                const transaction =
                    db.transaction(
                        ["keys"],
                        "readonly"
                    );

                const store =
                    transaction.objectStore(
                        "keys"
                    );


                const request =
                    store.get("myKeys");


                request.onsuccess =
                    function() {

                        const data =
                            request.result;


                        if (!data) {

                            resolve(false);

                            return;
                        }


                        rsaKeyPair = {

                            publicKey:
                                data.rsaPublicKey,

                            privateKey:
                                data.rsaPrivateKey

                        };


                        signKeyPair = {

                            publicKey:
                                data.signPublicKey,

                            privateKey:
                                data.signPrivateKey

                        };


                        resolve(true);
                    };


                request.onerror =
                    function() {

                        reject(
                            request.error
                        );

                    };

            }
        );
    }


    // =====================================================
    // AUTH MODE
    // =====================================================

    document
        .getElementById("switchText")
        .addEventListener(
            "click",
            () => {

                isRegisterMode =
                    !isRegisterMode;


                const button =
                    document.getElementById(
                        "authButton"
                    );

                const text =
                    document.getElementById(
                        "switchText"
                    );


                if (isRegisterMode) {

                    button.textContent =
                        "Đăng ký";

                    text.textContent =
                        "Đã có tài khoản? Đăng nhập";

                } else {

                    button.textContent =
                        "Đăng nhập";

                    text.textContent =
                        "Chưa có tài khoản? Đăng ký";
                }

            }
        );


    // =====================================================
    // REGISTER / LOGIN
    // =====================================================

    async function handleAuth() {

        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const status =
            document
                .getElementById("authStatus");


        if (!username || !password) {

            status.textContent =
                "Vui lòng nhập tài khoản và mật khẩu!";

            return;
        }


        try {

            // Chờ IndexedDB
            await waitForDatabase();


            // =================================================
            // ĐĂNG KÝ
            // =================================================

            if (isRegisterMode) {

                status.textContent =
                    "Đang tạo khóa bảo mật...";


                // Tạo bộ khóa mới
                await generateKeys();


                const publicKey =
                    await exportPublicKey(
                        rsaKeyPair.publicKey
                    );


                const signPublicKey =
                    await exportPublicKey(
                        signKeyPair.publicKey
                    );


                status.textContent =
                    "Đang đăng ký tài khoản...";


                socket.emit(
                    "register_account",
                    {
                        username,
                        password,
                        publicKey,
                        signPublicKey
                    },
                    async (response) => {

                        if (!response.success) {

                            status.textContent =
                                response.message;

                            return;
                        }


                        // Chỉ lưu private key
                        // sau khi server đăng ký thành công
                        try {

                            await saveKeys();

                            status.textContent =
                                response.message;

                            isRegisterMode =
                                false;

                            document
                                .getElementById(
                                    "authButton"
                                )
                                .textContent =
                                "Đăng nhập";


                            document
                                .getElementById(
                                    "switchText"
                                )
                                .textContent =
                                "Chưa có tài khoản? Đăng ký";

                        } catch (error) {

                            console.error(error);

                            status.textContent =
                                "Đăng ký thành công nhưng không lưu được khóa trên trình duyệt.";

                        }

                    }
                );

                return;
            }


            // =================================================
            // ĐĂNG NHẬP
            // =================================================

            status.textContent =
                "Đang tải khóa bảo mật...";


            const keysLoaded =
                await loadKeys();


            if (!keysLoaded) {

                status.textContent =
                    "Không tìm thấy khóa bảo mật. " +
                    "Bạn phải đăng nhập trên trình duyệt đã đăng ký tài khoản này.";

                return;
            }


            const publicKey =
                await exportPublicKey(
                    rsaKeyPair.publicKey
                );


            const signPublicKey =
                await exportPublicKey(
                    signKeyPair.publicKey
                );


            status.textContent =
                "Đang đăng nhập...";


            socket.emit(
                "login_account",
                {
                    username,
                    password,
                    publicKey,
                    signPublicKey
                },
                (response) => {

                    if (!response.success) {

                        status.textContent =
                            response.message;

                        return;
                    }


                    currentUsername =
                        username;


                    showChatScreen();

                }
            );

        } catch (error) {

            console.error(
                "Auth error:",
                error
            );

            status.textContent =
                "Có lỗi: " +
                error.message;
        }
    }


    // =====================================================
    // SHOW CHAT
    // =====================================================

    async function showChatScreen() {

        document
            .getElementById("authScreen")
            .style.display = "none";


        document
            .getElementById("chatScreen")
            .style.display = "block";


        document
            .getElementById("currentUser")
            .textContent =
                currentUsername;


        socket.emit(
            "request_user_list"
        );


        await loadMessageHistory();

    }


    // =====================================================
    // USER LIST
    // =====================================================

    socket.on(
        "update_user_list",
        (users) => {

            const select =
                document.getElementById(
                    "receiverSelect"
                );


            const currentValue =
                select.value;


            select.innerHTML = "";


            const defaultOption =
                document.createElement(
                    "option"
                );

            defaultOption.value = "";

            defaultOption.textContent =
                "-- Chọn người nhận --";

            select.appendChild(
                defaultOption
            );


            users.forEach(
                (username) => {

                    if (
                        username ===
                        currentUsername
                    ) {
                        return;
                    }


                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        username;

                    option.textContent =
                        username;

                    select.appendChild(
                        option
                    );
                }
            );


            if (
                users.includes(
                    currentValue
                )
            ) {

                select.value =
                    currentValue;
            }

        }
    );


    // =====================================================
    // SEND MESSAGE
    // =====================================================

    async function sendMessage() {

        if (!currentUsername) {
            return;
        }


        const receiver =
            document
                .getElementById(
                    "receiverSelect"
                )
                .value;


        const input =
            document
                .getElementById(
                    "messageInput"
                );


        const message =
            input.value.trim();


        if (!receiver) {

            alert(
                "Vui lòng chọn người nhận!"
            );

            return;
        }


        if (!message) {
            return;
        }


        const sendButton =
            document.getElementById(
                "sendButton"
            );


        try {

            sendButton.disabled = true;

            sendButton.textContent =
                "Đang mã hóa...";


            // =================================================
            // 1. LẤY PUBLIC KEY NGƯỜI NHẬN
            // =================================================

            socket.emit(
                "get_public_key",
                receiver,
                async (response) => {

                    if (!response.success) {

                        alert(
                            response.message
                        );

                        sendButton.disabled =
                            false;

                        sendButton.textContent =
                            "Mã Hóa & Gửi Tin Nhắn";

                        return;
                    }


                    try {

                        // =================================================
                        // 2. IMPORT RSA PUBLIC KEY NGƯỜI NHẬN
                        // =================================================

                        const receiverPublicKey =
                            await crypto.subtle.importKey(

                                "spki",

                                base64ToArrayBuffer(
                                    response.publicKey
                                ),

                                {
                                    name:
                                        "RSA-OAEP",

                                    hash:
                                        "SHA-256"
                                },

                                false,

                                [
                                    "encrypt"
                                ]
                            );


                        // =================================================
                        // 3. SHA-256
                        // =================================================

                        const messageHash =
                            await sha256(
                                message
                            );


                        // =================================================
                        // 4. TẠO PAYLOAD
                        // =================================================

                        const payload = {

                            msg:
                                message,

                            hash:
                                messageHash
                        };


                        const payloadText =
                            JSON.stringify(
                                payload
                            );


                        // =================================================
                        // 5. RSA-PSS SIGNATURE
                        // =================================================

                        const signatureBuffer =
                            await crypto.subtle.sign(

                                {
                                    name:
                                        "RSA-PSS",

                                    saltLength:
                                        32
                                },

                                signKeyPair.privateKey,

                                new TextEncoder()
                                    .encode(
                                        payloadText
                                    )
                            );


                        const signature =
                            arrayBufferToBase64(
                                signatureBuffer
                            );


                        // =================================================
                        // 6. TẠO AES-256 KEY
                        // =================================================

                        const aesKey =
                            await crypto.subtle.generateKey(

                                {
                                    name:
                                        "AES-GCM",

                                    length:
                                        256
                                },

                                true,

                                [
                                    "encrypt",
                                    "decrypt"
                                ]
                            );


                        // =================================================
                        // 7. TẠO IV
                        // =================================================

                        const iv =
                            crypto
                                .getRandomValues(
                                    new Uint8Array(
                                        12
                                    )
                                );


                        // =================================================
                        // 8. AES-GCM ENCRYPT
                        // =================================================

                        const encryptedBuffer =
                            await crypto.subtle.encrypt(

                                {
                                    name:
                                        "AES-GCM",

                                    iv:
                                        iv
                                },

                                aesKey,

                                new TextEncoder()
                                    .encode(
                                        payloadText
                                    )
                            );


                        // =================================================
                        // 9. EXPORT AES KEY
                        // =================================================

                        const rawAesKey =
                            await crypto.subtle.exportKey(
                                "raw",
                                aesKey
                            );


                        // =================================================
                        // 10. RSA-OAEP ENCRYPT AES KEY
                        // =================================================

                        const encryptedAesKeyBuffer =
                            await crypto.subtle.encrypt(

                                {
                                    name:
                                        "RSA-OAEP"
                                },

                                receiverPublicKey,

                                rawAesKey
                            );


                        // =================================================
                        // 11. TẠO PACKET
                        // =================================================

                        const packet = {

                            senderUsername:
                                currentUsername,

                            receiverUsername:
                                receiver,

                            encryptedContent:
                                arrayBufferToBase64(
                                    encryptedBuffer
                                ),

                            encryptedAesKey:
                                arrayBufferToBase64(
                                    encryptedAesKeyBuffer
                                ),

                            iv:
                                arrayBufferToBase64(
                                    iv.buffer
                                ),

                            signature:
                                signature,

                            timestamp:
                                Date.now()

                        };


                        // =================================================
                        // 12. GỬI SERVER
                        // =================================================

                        socket.emit(
                            "send_secure_message",
                            packet
                        );


                        // =================================================
                        // 13. HIỂN THỊ TIN NHẮN CỦA MÌNH
                        // =================================================

                        saveMessageLocally({

                            senderUsername:
                                currentUsername,

                            receiverUsername:
                                receiver,

                            message:
                                message,

                            timestamp:
                                packet.timestamp

                        });


                        renderMessageToUI({

                            senderUsername:
                                currentUsername,

                            receiverUsername:
                                receiver,

                            message:
                                message,

                            timestamp:
                                packet.timestamp

                        });


                        input.value = "";

                    } catch (error) {

                        console.error(
                            "Encryption error:",
                            error
                        );

                        alert(
                            "Không thể mã hóa tin nhắn!"
                        );

                    } finally {

                        sendButton.disabled =
                            false;

                        sendButton.textContent =
                            "Mã Hóa & Gửi Tin Nhắn";
                    }

                }
            );

        } catch (error) {

            console.error(error);

            sendButton.disabled =
                false;

            sendButton.textContent =
                "Mã Hóa & Gửi Tin Nhắn";
        }
    }


    // =====================================================
    // RECEIVE MESSAGE
    // =====================================================

    socket.on(
        "receive_secure_message",
        async (packet) => {

            try {

                // =================================================
                // 1. GIẢI MÃ AES KEY BẰNG RSA PRIVATE KEY
                // =================================================

                const encryptedAesKey =
                    base64ToArrayBuffer(
                        packet.encryptedAesKey
                    );


                const rawAesKey =
                    await crypto.subtle.decrypt(

                        {
                            name:
                                "RSA-OAEP"
                        },

                        rsaKeyPair.privateKey,

                        encryptedAesKey
                    );


                // =================================================
                // 2. IMPORT AES KEY
                // =================================================

                const aesKey =
                    await crypto.subtle.importKey(

                        "raw",

                        rawAesKey,

                        {
                            name:
                                "AES-GCM"
                        },

                        false,

                        [
                            "decrypt"
                        ]
                    );


                // =================================================
                // 3. GIẢI MÃ NỘI DUNG
                // =================================================

                const iv =
                    new Uint8Array(
                        base64ToArrayBuffer(
                            packet.iv
                        )
                    );


                const encryptedContent =
                    base64ToArrayBuffer(
                        packet.encryptedContent
                    );


                const decryptedBuffer =
                    await crypto.subtle.decrypt(

                        {
                            name:
                                "AES-GCM",

                            iv:
                                iv
                        },

                        aesKey,

                        encryptedContent
                    );


                const payloadText =
                    new TextDecoder()
                        .decode(
                            decryptedBuffer
                        );


                const payload =
                    JSON.parse(
                        payloadText
                    );


                // =================================================
                // 4. IMPORT SIGN PUBLIC KEY
                // =================================================

                const senderSignPublicKey =
                    await crypto.subtle.importKey(

                        "spki",

                        base64ToArrayBuffer(
                            packet.senderSignPubKey
                        ),

                        {
                            name:
                                "RSA-PSS",

                            hash:
                                "SHA-256"
                        },

                        false,

                        [
                            "verify"
                        ]
                    );


                // =================================================
                // 5. KIỂM TRA CHỮ KÝ
                // =================================================

                const signatureValid =
                    await crypto.subtle.verify(

                        {
                            name:
                                "RSA-PSS",

                            saltLength:
                                32
                        },

                        senderSignPublicKey,

                        base64ToArrayBuffer(
                            packet.signature
                        ),

                        new TextEncoder()
                            .encode(
                                payloadText
                            )
                    );


                // =================================================
                // 6. KIỂM TRA SHA-256
                // =================================================

                const calculatedHash =
                    await sha256(
                        payload.msg
                    );


                const hashValid =
                    calculatedHash ===
                    payload.hash;


                // =================================================
                // 7. NẾU CHỮ KÝ HOẶC HASH SAI
                // =================================================

                if (
                    !signatureValid ||
                    !hashValid
                ) {

                    renderWarningMessage(
                        "⚠️ Cảnh báo: Tin nhắn không hợp lệ hoặc đã bị thay đổi!"
                    );

                    return;
                }


                // =================================================
                // 8. HIỂN THỊ
                // =================================================

                const localMessage = {

                    senderUsername:
                        packet.senderUsername,

                    receiverUsername:
                        packet.receiverUsername,

                    message:
                        payload.msg,

                    timestamp:
                        packet.timestamp

                };


                renderMessageToUI(
                    localMessage
                );


                saveMessageLocally(
                    localMessage
                );

            } catch (error) {

                console.error(
                    "Decrypt error:",
                    error
                );

                renderWarningMessage(
                    "⚠️ Không thể giải mã tin nhắn!"
                );
            }

        }
    );


    // =====================================================
    // SAVE MESSAGE
    // =====================================================

    function saveMessageLocally(messageData) {

        if (!dbReady) {
            return;
        }


        const chatKey =
            createChatKey(
                messageData.senderUsername,
                messageData.receiverUsername
            );


        const transaction =
            db.transaction(
                ["messages"],
                "readwrite"
            );


        const store =
            transaction.objectStore(
                "messages"
            );


        store.add({

            chatKey:
                chatKey,

            senderUsername:
                messageData.senderUsername,

            receiverUsername:
                messageData.receiverUsername,

            message:
                messageData.message,

            timestamp:
                messageData.timestamp

        });
    }


    // =====================================================
    // CREATE CHAT KEY
    // =====================================================

    function createChatKey(user1, user2) {

        return [
            user1,
            user2
        ]
            .sort()
            .join("::");
    }


    // =====================================================
    // LOAD HISTORY
    // =====================================================

    async function loadMessageHistory() {

        await waitForDatabase();


        const transaction =
            db.transaction(
                ["messages"],
                "readonly"
            );


        const store =
            transaction.objectStore(
                "messages"
            );


        return new Promise(
            (resolve) => {

                const request =
                    store.getAll();


                request.onsuccess =
                    function() {

                        const messages =
                            request.result;


                        document
                            .getElementById(
                                "chatBox"
                            )
                            .innerHTML = "";


                        if (
                            messages.length ===
                            0
                        ) {

                            showEmptyMessage();

                            resolve();

                            return;
                        }


                        messages
                            .sort(
                                (a, b) =>
                                    a.timestamp -
                                    b.timestamp
                            );


                        messages.forEach(
                            message => {

                                renderMessageToUI(
                                    message
                                );

                            }
                        );


                        resolve();
                    };

            }
        );
    }


    // =====================================================
    // RENDER MESSAGE
    // =====================================================

    function renderMessageToUI(data) {

        const chatBox =
            document.getElementById(
                "chatBox"
            );


        const empty =
            chatBox.querySelector(
                ".empty-message"
            );


        if (empty) {
            empty.remove();
        }


        const messageDiv =
            document.createElement(
                "div"
            );


        const isMine =
            data.senderUsername ===
            currentUsername;


        messageDiv.className =
            "message" +
            (isMine
                ? " mine"
                : "");


        const contentDiv =
            document.createElement(
                "div"
            );


        contentDiv.className =
            "message-content";


        const infoDiv =
            document.createElement(
                "div"
            );


        infoDiv.className =
            "message-info";


        const time =
            new Date(
                data.timestamp
            );


        infoDiv.textContent =
            data.senderUsername +
            " • " +
            time.toLocaleTimeString(
                "vi-VN",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


        const textDiv =
            document.createElement(
                "div"
            );


        textDiv.className =
            "message-text";


        // textContent để chống XSS
        textDiv.textContent =
            data.message;


        contentDiv.appendChild(
            infoDiv
        );

        contentDiv.appendChild(
            textDiv
        );

        messageDiv.appendChild(
            contentDiv
        );

        chatBox.appendChild(
            messageDiv
        );


        chatBox.scrollTop =
            chatBox.scrollHeight;
    }


    // =====================================================
    // WARNING MESSAGE
    // =====================================================

    function renderWarningMessage(text) {

        const chatBox =
            document.getElementById(
                "chatBox"
            );


        const div =
            document.createElement(
                "div"
            );


        div.style.color =
            "#fca5a5";

        div.style.textAlign =
            "center";

        div.style.padding =
            "10px";


        div.textContent =
            text;


        chatBox.appendChild(
            div
        );


        chatBox.scrollTop =
            chatBox.scrollHeight;
    }


    // =====================================================
    // EMPTY MESSAGE
    // =====================================================

    function showEmptyMessage() {

        const chatBox =
            document.getElementById(
                "chatBox"
            );


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "empty-message";


        div.textContent =
            "Chưa có tin nhắn.";


        chatBox.appendChild(
            div
        );
    }


    // =====================================================
    // ENTER TO SEND
    // =====================================================

    function handleEnter(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }


    // =====================================================
    // LOGOUT
    // =====================================================

    function logout() {

        socket.emit(
            "logout_account"
        );


        currentUsername = null;


        rsaKeyPair = null;

        signKeyPair = null;


        document
            .getElementById(
                "chatScreen"
            )
            .style.display = "none";


        document
            .getElementById(
                "authScreen"
            )
            .style.display = "block";


        document
            .getElementById(
                "password"
            )
            .value = "";


        document
            .getElementById(
                "authStatus"
            )
            .textContent =
            "Đã đăng xuất.";
    }


    // =====================================================
    // FORCE LOGOUT
    // =====================================================

    socket.on(
        "force_logout",
        (data) => {

            alert(
                data.message
            );


            currentUsername = null;

            rsaKeyPair = null;

            signKeyPair = null;


            document
                .getElementById(
                    "chatScreen"
                )
                .style.display = "none";


            document
                .getElementById(
                    "authScreen"
                )
                .style.display = "block";


            document
                .getElementById(
                    "authStatus"
                )
                .textContent =
                "Phiên đăng nhập đã kết thúc.";
        }
    );


    // =====================================================
    // SEND ERROR
    // =====================================================

    socket.on(
        "message_send_error",
        (data) => {

            alert(
                data.message
            );
        }
    );

</script>
